name: T1 Touch Bar bug report
description: Report a driver, build, or guarded x619 activation problem without private artifacts.
title: "[T1] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do **not** attach FDRData, tickets, personalized images, raw logs, serials, ECIDs, or nonces. Read SECURITY.md first.
  - type: input
    id: model
    attributes:
      label: Mac model
      placeholder: MacBookPro13,2
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Omarchy and kernel versions
      placeholder: Omarchy 4.x; Linux 7.x
    validations:
      required: true
  - type: dropdown
    id: usb_state
    attributes:
      label: T1 USB state
      options:
        - production iBridge (05ac:8600)
        - recovery (05ac:1281)
        - not detected
    validations:
      required: true
  - type: textarea
    id: safe_status
    attributes:
      label: Safe status output
      description: Paste only ./scripts/status.sh output. Do not paste a raw restore or usbmuxd log.
      render: shell
  - type: textarea
    id: result
    attributes:
      label: Expected and observed result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach or paste T1 identity data, personalized files, firmware, or raw logs.
          required: true
